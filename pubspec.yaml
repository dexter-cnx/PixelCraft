name: pixelcraft
description: Offline, ultra-fast image editor powered by Flutter and Rust.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  camera: ^0.10.6
  image_picker: ^1.1.2
  flutter_rust_bridge: ^2.12.0
  path_provider: ^2.1.5
  saver_gallery: 5.0.3
  share_plus: ^12.0.2
  pixelcraft_engine:
    path: packages/pixelcraft_engine
  pixelcraft_gpu:
    path: packages/pixelcraft_gpu

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
