name: pixelcraft
description: Offline, ultra-fast image editor powered by Flutter and Rust.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  flutter_rust_bridge: ^2.12.0
  path_provider: ^2.1.5

  # Local FFI plugin generated by flutter_rust_bridge. Without this path
  # dependency Flutter does not register CargoKit, so the Rust .so is built
  # outside the app dependency graph and never bundled into the APK.
  pixelcraft_engine:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
