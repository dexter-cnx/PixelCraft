name: PF3 confirm look selection

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Apply confirm-on-exit look UX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()

          old = '''  void _selectTool(CameraPrimaryTool tool) {
    if (tool != CameraPrimaryTool.film && !_useNativeGpu) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('camera.native_look_required'.tr())),
      );
      return;
    }
    final willExpand = tool != _selectedTool || !_toolPanelExpanded;
    setState(() {
      _selectedTool = tool;
      _toolPanelExpanded = willExpand;
    });
    if (willExpand &&
        (tool == CameraPrimaryTool.film || tool == CameraPrimaryTool.filter)) {
      unawaited(_refreshLookPreviews(tool));
    }
  }
'''
          new = '''  bool get _isLookTrayOpen =>
      _toolPanelExpanded &&
      (_selectedTool == CameraPrimaryTool.film ||
          _selectedTool == CameraPrimaryTool.filter);

  Future<void> _confirmOpenLookTray() async {
    if (!_isLookTrayOpen) return;
    await _lookCoordinator.flush();
    if (!mounted) return;
    setState(() => _toolPanelExpanded = false);
  }

  Future<void> _handleToolSelection(CameraPrimaryTool tool) async {
    if (tool != CameraPrimaryTool.film && !_useNativeGpu) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('camera.native_look_required'.tr())),
      );
      return;
    }

    if (_isLookTrayOpen && tool == _selectedTool) {
      await _confirmOpenLookTray();
      return;
    }

    if (_isLookTrayOpen &&
        (tool == CameraPrimaryTool.film || tool == CameraPrimaryTool.filter)) {
      await _confirmOpenLookTray();
      if (!mounted) return;
    }

    final willExpand = tool != _selectedTool || !_toolPanelExpanded;
    setState(() {
      _selectedTool = tool;
      _toolPanelExpanded = willExpand;
    });
    if (willExpand &&
        (tool == CameraPrimaryTool.film || tool == CameraPrimaryTool.filter)) {
      unawaited(_refreshLookPreviews(tool));
    }
  }

  void _selectTool(CameraPrimaryTool tool) {
    unawaited(_handleToolSelection(tool));
  }
'''
          if old not in text:
              raise SystemExit('selectTool block not found')
          text = text.replace(old, new, 1)

          old_viewfinder = '            _buildViewfinder(),\n'
          new_viewfinder = '''            GestureDetector(
              behavior: HitTestBehavior.opaque,
              onTap: _isLookTrayOpen
                  ? () => unawaited(_confirmOpenLookTray())
                  : null,
              child: _buildViewfinder(),
            ),
'''
          if old_viewfinder not in text:
              raise SystemExit('viewfinder stack entry not found')
          text = text.replace(old_viewfinder, new_viewfinder, 1)

          path.write_text(text)
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_confirm_look_selection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "feat: confirm camera look tray on exit"
          git push origin HEAD:feature/pf3-capture-process-save
