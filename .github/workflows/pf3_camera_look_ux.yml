name: PF3 camera look UX

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Apply camera-native Film and Filter UX
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/ui/camera/camera_look_carousel.dart <<'DART'
          import 'package:flutter/material.dart';

          const _dxtrOrange = Color(0xFFFF6A00);

          class CameraLookCarouselItem {
            const CameraLookCarouselItem({
              required this.id,
              required this.label,
              required this.icon,
            });

            final String id;
            final String label;
            final IconData icon;
          }

          class CameraLookCarousel extends StatelessWidget {
            const CameraLookCarousel({
              required this.items,
              required this.selectedId,
              required this.onSelected,
              this.enabled = true,
              super.key,
            });

            final List<CameraLookCarouselItem> items;
            final String selectedId;
            final ValueChanged<String> onSelected;
            final bool enabled;

            @override
            Widget build(BuildContext context) {
              return SizedBox(
                height: 82,
                child: ListView.separated(
                  padding: const EdgeInsets.symmetric(horizontal: 18),
                  scrollDirection: Axis.horizontal,
                  physics: const BouncingScrollPhysics(),
                  itemCount: items.length,
                  separatorBuilder: (_, __) => const SizedBox(width: 10),
                  itemBuilder: (context, index) {
                    final item = items[index];
                    final selected = item.id == selectedId;
                    return Semantics(
                      button: true,
                      selected: selected,
                      label: item.label,
                      child: GestureDetector(
                        onTap: enabled ? () => onSelected(item.id) : null,
                        child: AnimatedScale(
                          scale: selected ? 1 : 0.94,
                          duration: const Duration(milliseconds: 150),
                          curve: Curves.easeOutCubic,
                          child: AnimatedContainer(
                            duration: const Duration(milliseconds: 150),
                            curve: Curves.easeOutCubic,
                            width: selected ? 92 : 82,
                            padding: const EdgeInsets.symmetric(
                              horizontal: 10,
                              vertical: 9,
                            ),
                            decoration: BoxDecoration(
                              color: selected
                                  ? Colors.black.withValues(alpha: 0.82)
                                  : Colors.black.withValues(alpha: 0.56),
                              borderRadius: BorderRadius.circular(18),
                              border: Border.all(
                                color: selected ? _dxtrOrange : Colors.white24,
                                width: selected ? 2 : 1,
                              ),
                              boxShadow: selected
                                  ? const [
                                      BoxShadow(
                                        color: Color(0x55FF6A00),
                                        blurRadius: 16,
                                        spreadRadius: 1,
                                      ),
                                    ]
                                  : null,
                            ),
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(
                                  item.icon,
                                  size: 22,
                                  color: selected ? _dxtrOrange : Colors.white70,
                                ),
                                const SizedBox(height: 7),
                                Text(
                                  item.label,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  textAlign: TextAlign.center,
                                  style: TextStyle(
                                    color: Colors.white,
                                    fontSize: 12,
                                    fontWeight: selected
                                        ? FontWeight.w800
                                        : FontWeight.w600,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }
          DART

          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()

          import_anchor = "import '../camera/camera_primary_controls.dart';\n"
          carousel_import = "import '../camera/camera_look_carousel.dart';\n"
          if carousel_import not in text:
              text = text.replace(import_anchor, carousel_import + import_anchor, 1)

          film_start = text.index('  Widget _buildFilmControls() {')
          filter_start = text.index('  Widget _buildFilterControls() {')
          adjust_start = text.index('  Widget _buildAdjustControls() {')

          film = r'''  Widget _buildFilmControls() {
    final items = cameraFilmPresets
        .map(
          (preset) => CameraLookCarouselItem(
            id: preset.id,
            label: preset.name.replaceAll(' Inspired', ''),
            icon: preset.isOriginal
                ? Icons.block_flipped
                : Icons.local_movies_outlined,
          ),
        )
        .toList(growable: false);
    return Positioned(
      left: 0,
      right: 0,
      bottom: 156,
      child: DecoratedBox(
        decoration: _lookPanelDecoration,
        child: Padding(
          padding: const EdgeInsets.fromLTRB(0, 30, 0, 8),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              Text(
                _preset.name.replaceAll(' Inspired', ''),
                style: const TextStyle(
                  color: Colors.white,
                  fontSize: 16,
                  fontWeight: FontWeight.w800,
                  letterSpacing: 0.1,
                ),
              ),
              const SizedBox(height: 8),
              CameraLookCarousel(
                items: items,
                selectedId: _preset.id,
                enabled: !_isCapturing,
                onSelected: (id) {
                  final preset = cameraFilmPresets.firstWhere(
                    (candidate) => candidate.id == id,
                  );
                  _selectPreset(preset);
                },
              ),
              AnimatedSwitcher(
                duration: const Duration(milliseconds: 160),
                child: _preset.isOriginal
                    ? const SizedBox(height: 8)
                    : Padding(
                        key: ValueKey('film-strength-${_preset.id}'),
                        padding: const EdgeInsets.fromLTRB(36, 2, 36, 0),
                        child: Row(
                          children: [
                            const Icon(
                              Icons.opacity_rounded,
                              color: Colors.white54,
                              size: 16,
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: Slider(
                                value: _strength,
                                min: 0,
                                max: 1,
                                onChanged: _isCapturing ? null : _setStrength,
                              ),
                            ),
                            SizedBox(
                              width: 36,
                              child: Text(
                                '${(_strength * 100).round()}',
                                textAlign: TextAlign.end,
                                style: const TextStyle(
                                  color: Colors.white70,
                                  fontSize: 12,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
              ),
            ],
          ),
        ),
      ),
    );
  }

'''

          filt = r'''  Widget _buildFilterControls() {
    final activeId = _cameraLook.creativeFilterId;
    final items = <CameraLookCarouselItem>[
      CameraLookCarouselItem(
        id: '',
        label: 'camera.original'.tr(),
        icon: Icons.block_flipped,
      ),
      ...cameraCreativeFilters.map(
        (filter) => CameraLookCarouselItem(
          id: filter.id,
          label: 'camera.${filter.id}'.tr(),
          icon: Icons.auto_awesome_outlined,
        ),
      ),
    ];
    return Positioned(
      left: 0,
      right: 0,
      bottom: 156,
      child: DecoratedBox(
        decoration: _lookPanelDecoration,
        child: Padding(
          padding: const EdgeInsets.fromLTRB(0, 30, 0, 8),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              Text(
                activeId.isEmpty
                    ? 'camera.original'.tr()
                    : 'camera.$activeId'.tr(),
                style: const TextStyle(
                  color: Colors.white,
                  fontSize: 16,
                  fontWeight: FontWeight.w800,
                  letterSpacing: 0.1,
                ),
              ),
              const SizedBox(height: 8),
              CameraLookCarousel(
                items: items,
                selectedId: activeId,
                enabled: !_isCapturing,
                onSelected: (id) =>
                    _selectCreativeFilter(id.isEmpty ? null : id),
              ),
              AnimatedSwitcher(
                duration: const Duration(milliseconds: 160),
                child: activeId.isEmpty
                    ? const SizedBox(height: 8)
                    : Padding(
                        key: ValueKey('filter-strength-$activeId'),
                        padding: const EdgeInsets.fromLTRB(36, 2, 36, 0),
                        child: Row(
                          children: [
                            const Icon(
                              Icons.opacity_rounded,
                              color: Colors.white54,
                              size: 16,
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: Slider(
                                value: _cameraLook.creativeFilterStrength,
                                min: 0,
                                max: 1,
                                onChanged: _isCapturing
                                    ? null
                                    : _setCreativeStrength,
                              ),
                            ),
                            SizedBox(
                              width: 36,
                              child: Text(
                                '${(_cameraLook.creativeFilterStrength * 100).round()}',
                                textAlign: TextAlign.end,
                                style: const TextStyle(
                                  color: Colors.white70,
                                  fontSize: 12,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
              ),
            ],
          ),
        ),
      ),
    );
  }

'''

          text = text[:film_start] + film + filt + text[adjust_start:]
          path.write_text(text)

          doc = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          if doc.exists():
              d = doc.read_text()
              marker = '## Camera Look UX polish\n'
              if marker not in d:
                  d += '''\n## Camera Look UX polish\n\n- Film and Filter use a camera-native horizontal carousel instead of compact ChoiceChips.\n- The selected look is visually dominant with the Dextryx orange accent while the full-screen viewfinder remains the authoritative live preview.\n- Strength is a compact contextual control shown only for non-original Film/Filter selections.\n- Adjust remains unchanged in this pass to keep the UX change scoped and avoid destabilizing PF3 capture semantics.\n'''
                  doc.write_text(d)
          PY

          dart format lib/ui/camera/camera_look_carousel.dart lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_camera_look_ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/camera/camera_look_carousel.dart lib/ui/screens/camera_film_preview_screen_g1.dart docs/PF3_CAPTURE_PROCESS_SAVE.md
          git commit -m "Polish camera Film and Filter UX"
          git push origin HEAD:feature/pf3-capture-process-save
