name: PF3 generate camera-first icon

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - name: Generate launcher assets
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tool/generate_camera_first_icon.py
          rm .github/workflows/pf3_generate_camera_icon.yml
      - name: Commit generated icon set
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: apply orange-black camera-first launcher icons'
          git push origin HEAD:feature/pf3-capture-process-save
