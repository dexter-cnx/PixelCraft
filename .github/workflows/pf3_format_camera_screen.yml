name: PF3 format camera screen

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Format camera screen
        run: |
          set -euo pipefail
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_format_camera_screen.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "fix: format compact camera UX"
          git push origin HEAD:feature/pf3-capture-process-save
# trigger one-shot formatter
