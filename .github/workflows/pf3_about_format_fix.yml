name: PF3 About and format fix

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Wire About into camera settings and translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          camera = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = camera.read_text()
          import_anchor = "import '../camera/camera_primary_controls.dart';\n"
          if "import 'about_screen.dart';" not in text:
              text = text.replace(import_anchor, import_anchor + "import 'about_screen.dart';\n")

          tile_anchor = """                  ListTile(\n                    leading: const Icon(Icons.cameraswitch_outlined),\n                    iconColor: Colors.white,\n                    textColor: Colors.white,\n                    title: Text('camera.switch_camera'.tr()),\n                    enabled: _canSwitchCamera,\n                    onTap: _canSwitchCamera\n                        ? () async {\n                            await _switchCamera();\n                            if (sheetContext.mounted) setSheetState(() {});\n                          }\n                        : null,\n                  ),\n"""
          about_tile = tile_anchor + """                  ListTile(\n                    leading: const Icon(Icons.info_outline_rounded),\n                    iconColor: Colors.white,\n                    textColor: Colors.white,\n                    title: Text('about.title'.tr()),\n                    onTap: () {\n                      Navigator.of(sheetContext).pop();\n                      Navigator.of(context).push(\n                        MaterialPageRoute<void>(\n                          builder: (_) => const AboutScreen(),\n                        ),\n                      );\n                    },\n                  ),\n"""
          if "builder: (_) => const AboutScreen()" not in text:
              if tile_anchor not in text:
                  raise SystemExit('camera settings anchor not found')
              text = text.replace(tile_anchor, about_tile)
          camera.write_text(text)

          translations = {
              'assets/translations/en.json': '''  "about": {\n    "title": "About",\n    "tagline": "Camera-first photography with fast local processing.",\n    "whats_new": "What’s New"\n  },\n''',
              'assets/translations/th.json': '''  "about": {\n    "title": "เกี่ยวกับ",\n    "tagline": "แอปถ่ายภาพแบบ Camera-first พร้อมการประมวลผลที่รวดเร็วบนเครื่อง",\n    "whats_new": "มีอะไรใหม่"\n  },\n''',
          }
          for filename, block in translations.items():
              path = Path(filename)
              content = path.read_text()
              if '"about": {' not in content:
                  anchor = '  "camera": {'
                  if anchor not in content:
                      raise SystemExit(f'translation anchor not found: {filename}')
                  content = content.replace(anchor, block + anchor, 1)
                  path.write_text(content)

          doc = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          content = doc.read_text()
          section = '''\n## Settings / About / What’s New\n\n- Camera Controls acts as the current mobile Settings surface.\n- Settings includes **About**.\n- About shows a **What’s New** entry whenever `currentWhatsNewId` is non-empty.\n- Opening What’s New from About is always allowed and does not modify the one-time Greeting seen-state.\n- The About What’s New page reuses the same localized feature copy as the release Greeting so release notes do not drift.\n'''
          if '## Settings / About / What’s New' not in content:
              content = content.replace('\n## Automated coverage\n', section + '\n## Automated coverage\n')
              doc.write_text(content)
          PY
      - name: Apply canonical Dart formatter
        run: |
          set -euo pipefail
          dart format \
            lib/app/platform_media_services.dart \
            lib/camera/camera_capture_pipeline.dart \
            lib/camera/camera_capture_save_handoff.dart \
            lib/main.dart \
            lib/ui/screens/about_screen.dart \
            lib/ui/screens/camera_film_preview_screen_g1.dart \
            lib/ui/screens/greeting_screen.dart \
            test/camera/camera_capture_pipeline_test.dart
          rm .github/workflows/pf3_about_format_fix.yml
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: add About Whats New and format PF3'
          git push origin HEAD:feature/pf3-capture-process-save
