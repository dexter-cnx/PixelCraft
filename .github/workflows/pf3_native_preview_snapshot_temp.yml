name: PF3 native preview snapshot patch

on:
  push:
    branches:
      - feature/pf3-capture-process-save
    paths:
      - .github/pf3_native_preview_snapshot_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - name: Add non-shutter iOS preview snapshot path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('packages/dxtr_pixs_gpu/ios/Classes/MetalCameraPreviewRenderer.swift')
          text = renderer.read_text()
          if 'import CoreImage\n' not in text:
              text = text.replace('import CoreMedia\n', 'import CoreImage\nimport CoreMedia\n', 1)
          anchor = '  func colorCharacterizationSample(maxSamples: Int = 4096) throws -> [String: Any] {'
          method = '''  func previewSnapshot(maxEdge: Int = 512) throws -> Data {
    frameLock.lock()
    guard let pixelBuffer = latestPixelBuffer else {
      frameLock.unlock()
      throw Self.error("No camera frame is available for preview snapshot")
    }
    frameLock.unlock()

    let source = CIImage(cvPixelBuffer: pixelBuffer)
    let extent = source.extent
    let longest = max(extent.width, extent.height)
    guard longest > 0 else {
      throw Self.error("Camera preview snapshot has invalid dimensions")
    }
    let clampedMaxEdge = CGFloat(max(64, min(maxEdge, 1024)))
    let scale = min(1.0, clampedMaxEdge / longest)
    let scaled = source.transformed(by: CGAffineTransform(scaleX: scale, y: scale))
    let context = CIContext(options: [.cacheIntermediates: false])
    guard let cgImage = context.createCGImage(scaled, from: scaled.extent) else {
      throw Self.error("Unable to render camera preview snapshot")
    }
    guard let data = UIImage(cgImage: cgImage).jpegData(compressionQuality: 0.82) else {
      throw Self.error("Unable to encode camera preview snapshot")
    }
    return data
  }

'''
          if 'func previewSnapshot(maxEdge:' not in text:
              if anchor not in text:
                  raise SystemExit('renderer snapshot insertion anchor not found')
              text = text.replace(anchor, method + anchor, 1)
          renderer.write_text(text)

          channel = Path('packages/dxtr_pixs_gpu/ios/Classes/GpuPreviewChannel.swift')
          text = channel.read_text()
          anchor = '    case "cameraControlState":\n'
          case = '''    case "previewSnapshot":
      guard let id = rendererId(call: call, result: result) else { return }
      do {
        let renderer = try registry.renderer(id: id)
        let maxEdge = (arguments(call)["maxEdge"] as? NSNumber)?.intValue ?? 512
        let bytes = try renderer.previewSnapshot(maxEdge: maxEdge)
        result(FlutterStandardTypedData(bytes: bytes))
      } catch {
        result(flutterError("gpu_camera_preview_snapshot_failed", error))
      }
'''
          if 'case "previewSnapshot":' not in text:
              if anchor not in text:
                  raise SystemExit('channel insertion anchor not found')
              text = text.replace(anchor, case + anchor, 1)
          channel.write_text(text)

          bridge = Path('packages/dxtr_pixs_gpu/lib/native_gpu_camera_bridge.dart')
          text = bridge.read_text()
          anchor = '  Future<NativeCameraControlState> controlState(String rendererId) async {'
          method = '''  Future<Uint8List> previewSnapshot(
    String rendererId, {
    int maxEdge = 512,
  }) async {
    final bytes = await _channel.invokeMethod<Uint8List>(
      'previewSnapshot',
      <String, Object?>{
        'protocolVersion': gpuPreviewProtocolVersion,
        'rendererId': rendererId,
        'maxEdge': maxEdge,
      },
    );
    if (bytes == null || bytes.isEmpty) {
      throw StateError('Native GPU camera preview snapshot returned no bytes');
    }
    return bytes;
  }

'''
          if 'Future<Uint8List> previewSnapshot(' not in text:
              if "import 'dart:typed_data';" not in text:
                  text = "import 'dart:typed_data';\n\n" + text
              if anchor not in text:
                  raise SystemExit('Dart bridge insertion anchor not found')
              text = text.replace(anchor, method + anchor, 1)
          bridge.write_text(text)

          screen = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = screen.read_text()
          text = text.replace("import 'dart:io';\n", '')
          text = text.replace("import 'dart:isolate';\n", '')
          text = text.replace("import '../../core/bridge.dart';\n", '')
          old = '''    if (!_enableStillCaptureLookPreviews) {
      if (!mounted) return;
      setState(() {
        _isLoadingLookPreviews = false;
        if (tool == CameraPrimaryTool.film) {
          _filmPreviewBytes = const {};
        } else {
          _filterPreviewBytes = const {};
        }
      });
      return;
    }

'''
          text = text.replace(old, '')
          text = text.replace('  final bool _enableStillCaptureLookPreviews = false;\n', '')
          start = text.find('    String? snapshotPath;\n    try {\n      final capture = await _nativeCameraBridge.capturePhoto(_gpuRendererId!);')
          end_marker = '      if (mounted && request == _lookPreviewRequest) {\n        setState(() => _isLoadingLookPreviews = false);\n      }\n    }\n'
          if start < 0:
              raise SystemExit('old shutter-backed preview block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('old shutter-backed preview block end not found')
          end += len(end_marker)
          replacement = '''    try {
      final source = await _nativeCameraBridge.previewSnapshot(
        _gpuRendererId!,
        maxEdge: 512,
      );
      if (!mounted || request != _lookPreviewRequest) return;

      final previews = <String, Uint8List>{};
      if (tool == CameraPrimaryTool.film) {
        final ids = cameraFilmPresets
            .where((preset) => !preset.isOriginal)
            .map((preset) => preset.id)
            .toList(growable: false);
        final generated = rust.generateFilmProfilePreviews(
          imageBytes: source,
          profileIds: ids,
          maxEdge: 180,
        );
        previews.addAll(<String, Uint8List>{
          '': source,
          for (final preview in generated) preview.id: preview.bytes,
        });
      } else {
        final ids = cameraCreativeFilters
            .map((filter) => filter.id)
            .toList(growable: false);
        final generated = rust.generateFilterPreviews(
          imageBytes: source,
          filterNames: ids,
          maxEdge: 180,
        );
        previews.addAll(<String, Uint8List>{
          '': source,
          for (final preview in generated) preview.name: preview.bytes,
        });
      }

      if (!mounted || request != _lookPreviewRequest) return;
      setState(() {
        if (tool == CameraPrimaryTool.film) {
          _filmPreviewBytes = previews;
        } else {
          _filterPreviewBytes = previews;
        }
      });
    } catch (error, stackTrace) {
      debugPrint('[PF3][LookPreview] generation failed: $error');
      debugPrintStack(stackTrace: stackTrace);
    } finally {
      if (mounted && request == _lookPreviewRequest) {
        setState(() => _isLoadingLookPreviews = false);
      }
    }
'''
          text = text[:start] + replacement + text[end:]
          screen.write_text(text)

          docs = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          doc = docs.read_text()
          heading = '## Film / Filter preview thumbnails'
          if heading in doc:
              before = doc.split(heading)[0].rstrip()
              doc = before + '\n\n' + heading + '''

- Film and Filter trays use a non-shutter snapshot of the latest native camera preview frame.
- iOS reads `latestPixelBuffer` from `AVCaptureVideoDataOutput`; it does not call `AVCapturePhotoOutput` and must not produce shutter sound.
- Flutter receives only one bounded JPEG snapshot when a Film/Filter tray opens; live frame streaming still never crosses MethodChannel.
- Rust generates 180px Film Profile / Creative Filter thumbnails from that bounded snapshot using the same processing semantics as the product pipeline.
- Latest-request-wins prevents stale tray results from replacing newer requests.
- Physical validation must confirm no shutter sound and acceptable tray-open latency on iPhone before PF3 is complete.
'''
          docs.write_text(doc)
          PY
          dart format packages/dxtr_pixs_gpu/lib/native_gpu_camera_bridge.dart lib/ui/screens/camera_film_preview_screen_g1.dart
          rm -f .github/pf3_native_preview_snapshot_trigger
          rm -f .github/workflows/pf3_native_preview_snapshot_temp.yml
      - name: Commit native preview snapshot implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: generate look thumbnails from native preview frame"
          git push origin HEAD:feature/pf3-capture-process-save
