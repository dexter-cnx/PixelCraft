name: Router Format Once

on:
  push:
    branches:
      - agent/go-router-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/go-router-foundation
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Format router slice
        run: |
          dart format \
            lib/app/app_routes.dart \
            lib/main.dart \
            lib/ui/screens/camera_film_preview_screen_g1.dart \
            test/app/app_routes_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/app/app_routes.dart lib/main.dart lib/ui/screens/camera_film_preview_screen_g1.dart test/app/app_routes_test.dart
          git commit -m "style: apply dart formatter"
          git push origin HEAD:agent/go-router-foundation
