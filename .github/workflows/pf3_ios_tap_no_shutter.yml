name: PF3 iOS tray tap no shutter

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Patch source and self-remove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()

          old_viewfinder = '''            GestureDetector(
              behavior: HitTestBehavior.opaque,
              onTap: _isLookTrayOpen
                  ? () => unawaited(_confirmOpenLookTray())
                  : null,
              child: _buildViewfinder(),
            ),
            _buildTopBar(),
'''
          new_viewfinder = '''            _buildViewfinder(),
            if (_isLookTrayOpen)
              Positioned.fill(
                child: GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTap: () => unawaited(_confirmOpenLookTray()),
                  child: const ColoredBox(color: Colors.transparent),
                ),
              ),
            _buildTopBar(),
'''
          if old_viewfinder not in text:
              raise SystemExit('wrapped viewfinder block not found')
          text = text.replace(old_viewfinder, new_viewfinder, 1)

          start = text.index('  Future<void> _refreshLookPreviews(CameraPrimaryTool tool) async {')
          end = text.index('\n  Future<void> _confirmOpenLookTray()', start)
          replacement = '''  Future<void> _refreshLookPreviews(CameraPrimaryTool tool) async {
    if (tool != CameraPrimaryTool.film && tool != CameraPrimaryTool.filter) {
      return;
    }

    // Do not call capturePhoto() to populate selector thumbnails. On iOS that
    // is a real still capture and produces the system shutter sound, which is
    // misleading while the user is only browsing Film/Filter looks. Keep the
    // selector usable without snapshots until native GPU live-look thumbnails
    // are available.
    if (!mounted) return;
    setState(() {
      _isLoadingLookPreviews = false;
      if (tool == CameraPrimaryTool.film) {
        _filmPreviewBytes = const {};
      } else {
        _filterPreviewBytes = const {};
      }
    });
  }
'''
          text = text[:start] + replacement + text[end:]

          path.write_text(text)
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_ios_tap_no_shutter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "fix: confirm look tray from platform view tap"
          git push origin HEAD:feature/pf3-capture-process-save
