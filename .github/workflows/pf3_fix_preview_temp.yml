name: PF3 fix look preview runtime

on:
  push:
    branches:
      - feature/pf3-capture-process-save
    paths:
      - .github/pf3_fix_preview_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - name: Reuse bootstrapped Rust bridge for look previews
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()
          text = text.replace("import 'dart:isolate';\n", '')
          text = text.replace("import '../../core/bridge.dart';\n", '')

          pattern = re.compile(r"      final previews = await Isolate\.run\(\(\) async \{\n        await initializeRustBridge\(\);\n(?P<body>.*?)\n      \}\);", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('look preview Isolate.run block not found')
          body = match.group('body')
          # The Rust bridge is already initialized by RustBootstrapScreen on the main isolate.
          replacement = "      final previews = <String, Uint8List>{};\n" + body
          replacement = replacement.replace('          return <String, Uint8List>{', '          previews.addAll(<String, Uint8List>{')
          replacement = replacement.replace('          };\n        }\n\n        final ids =', '          });\n        } else {\n          final ids =')
          replacement = replacement.replace('        return <String, Uint8List>{', '          previews.addAll(<String, Uint8List>{')
          replacement = replacement.replace('        };', '          });\n        }')
          text = text[:match.start()] + replacement + text[match.end():]

          old_catch = "    } catch (_) {\n    } finally {"
          new_catch = "    } catch (error, stackTrace) {\n      debugPrint('[PF3][LookPreview] generation failed: $error');\n      debugPrintStack(stackTrace: stackTrace);\n    } finally {"
          if old_catch not in text:
              raise SystemExit('silent look preview catch not found')
          text = text.replace(old_catch, new_catch, 1)
          path.write_text(text)

          docs = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          doc = docs.read_text()
          doc = doc.replace(
              '- Preview generation runs off the UI isolate and keeps the existing latest-request-wins guard so stale results cannot replace a newer tray request.',
              '- Preview generation reuses the Rust bridge already bootstrapped for the Camera route; it keeps the existing latest-request-wins guard so stale results cannot replace a newer tray request.'
          )
          docs.write_text(doc)
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          rm -f .github/pf3_fix_preview_trigger
          rm -f .github/workflows/pf3_fix_preview_temp.yml
      - name: Commit PF3 preview runtime fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: render PF3 Film and Filter previews"
          git push origin HEAD:feature/pf3-capture-process-save
