name: Docs Router Sync Once

on:
  push:
    branches:
      - agent/docs-router-sync

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-router-sync
      - name: Sync handoff and walkthrough
        run: |
          python3 <<'PY'
          from pathlib import Path

          handoff = Path('docs/PROJECT_HANDOFF.md')
          text = handoff.read_text()
          replacements = {
              "Last refresh: **2026-08-16. CI affected-validation architecture is implemented and full-validated on PR #49; product direction remains unchanged: phone/tablet are camera-first, desktop is editor/open/drop-first, PixelCraft owns camera/editor/image processing, Nixin/Dextryx Images owns long-lived image management. PF0 + PF1 remain the next product implementation slice.**":
              "Last refresh: **2026-08-17. PR #50 merged the `go_router` navigation foundation and platform-aware app entry. Phone/tablet now route camera-first at app launch, desktop remains editor/open/drop-first, and workspace navigation is declarative while Film/Filter/Adjust remain local tool state. PF0 routing is implemented; PF1/PF2 camera-shell integration is the next product slice.**",
              "PF0 Platform-flow foundations                   NEXT / NOT IMPLEMENTED\nPF1 Camera-first mobile/tablet shell             PLANNED":
              "PF0 Platform-flow foundations                   PARTIAL / ROUTING FOUNDATION MERGED (#50)\nPF1 Camera-first mobile/tablet shell             IN PROGRESS / CAMERA-FIRST ENTRY MERGED (#50)",
              "PF0 should be implemented before or as the first slice of PF1.":
              "PF0 is now partially implemented. PR #50 established the navigation/router foundation and platform-aware app entry; localization, preferences, processing-job state, and remaining service boundaries continue as PF0 follow-up work alongside PF1.",
              "AppRouter / navigation abstraction":
              "AppRouter / navigation abstraction   # go_router foundation implemented in PR #50",
              "Current runtime still boots Rust and returns `HomeScreen`; PF1 changes platform routing.":
              "Current runtime uses `MaterialApp.router` with one persistent `GoRouter`. Phone/tablet initial location is `/camera`; desktop initial location is `/desktop`. Both routes remain behind the shared Rust bootstrap, so navigation does not repeatedly initialize the native engine."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing handoff anchor: {old[:80]}')
              text = text.replace(old, new, 1)

          anchor = "## Processing job state\n"
          nav_section = """## Navigation foundation — merged in PR #50\n\nCanonical document:\n\n```text\ndocs/NAVIGATION_ARCHITECTURE.md\n```\n\nCurrent route contracts:\n\n```text\n/                       platform-aware entry\n/camera                 phone/tablet camera workspace\n/desktop                desktop open/drop workspace\n/editor                 product editor\n/films                  Film Profiles workspace\n/debug/gpu-editor-lab   debug-only GPU editor lab\n```\n\nNavigation rule:\n\n```text\nworkspace change = route\nworkspace tool change = state\n```\n\n`EditorRouteData` is passed through `GoRouterState.extra`, so arbitrary local file paths are not encoded into public URLs. Camera -> Editor already uses named routing. Film/Filter/Adjust interactions, sheets, dialogs, and local dismissals remain local UI state/local Navigator behavior. The router is created once at app startup and disposed with the app state; Rust bootstrap initialization is shared across routed workspaces.\n\n"""
          if nav_section not in text:
              if anchor not in text:
                  raise SystemExit('missing navigation insertion anchor')
              text = text.replace(anchor, nav_section + anchor, 1)
          handoff.write_text(text)

          walkthrough = Path('docs/CODE_WALKTHROUGH.md')
          text = walkthrough.read_text()
          old = "Current `lib/main.dart` still boots Rust and returns `HomeScreen`."
          new = "Current `lib/main.dart` uses `MaterialApp.router` with a persistent `GoRouter`. Platform entry is now explicit: phone/tablet start at `/camera`, while desktop starts at `/desktop`. Both workspaces are wrapped by the shared Rust bootstrap."
          if old not in text:
              raise SystemExit('missing walkthrough current-runtime anchor')
          text = text.replace(old, new, 1)

          anchor = "Current camera implementation is exposed through:\n"
          insert = """The navigation foundation lives in:\n\n```text\nlib/app/app_routes.dart\ndocs/NAVIGATION_ARCHITECTURE.md\n```\n\nCurrent route graph:\n\n```text\n/                       -> platform-aware initial workspace\n/camera                 -> CameraFilmPreviewScreen\n/desktop                -> HomeScreen / desktop open-drop shell\n/editor                 -> ProductEditorScreen or CameraFilmEditorHandoff\n/films                  -> FilmProfilesScreen\n/debug/gpu-editor-lab   -> debug GPU editor lab\n```\n\nRouting policy is intentionally narrow:\n\n```text\nworkspace change = route\nworkspace tool change = state\n```\n\nCamera -> Editor uses `context.pushNamed(...)` with typed `EditorRouteData`. The payload travels through `GoRouterState.extra`, avoiding arbitrary local file paths in URLs and leaving room for a future stable external asset identity from Nixin. Film/Filter/Adjust selection, modal sheets, and local dismissals remain local state/local Navigator interactions.\n\nThe app holds one router instance for its lifetime. `RustBootstrapScreen` uses a shared initialization future, so switching between routed workspaces does not rerun native initialization.\n\n"""
          if insert not in text:
              if anchor not in text:
                  raise SystemExit('missing walkthrough insertion anchor')
              text = text.replace(anchor, insert + anchor, 1)
          walkthrough.write_text(text)
          PY
      - name: Commit documentation sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PROJECT_HANDOFF.md docs/CODE_WALKTHROUGH.md
          if git diff --cached --quiet; then
            echo "No documentation changes needed."
            exit 0
          fi
          git commit -m "docs: sync router foundation status"
          git push origin HEAD:agent/docs-router-sync
