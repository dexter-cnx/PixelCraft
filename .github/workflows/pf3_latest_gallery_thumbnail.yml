name: PF3 latest Gallery thumbnail

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Add native latest-photo thumbnail support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Dart thumbnail cache: lazy-load the newest accessible system photo.
          Path('lib/camera/camera_recent_thumbnail.dart').write_text('''import 'package:flutter/foundation.dart';\nimport 'package:flutter/services.dart';\n\n/// Camera Gallery-button thumbnail.\n///\n/// On first Camera entry this lazily asks the native platform for the newest\n/// image the user has granted PixelCraft permission to read. After PixelCraft\n/// saves a new processed capture, [update] immediately replaces it in-memory.\nclass CameraRecentThumbnail {\n  CameraRecentThumbnail._();\n\n  static final CameraRecentThumbnail instance = CameraRecentThumbnail._();\n  static const _channel = MethodChannel('dev.cnxdev.pixelcraft/permissions');\n\n  final ValueNotifier<Uint8List?> bytes = ValueNotifier<Uint8List?>(null);\n  bool _attemptedInitialLoad = false;\n  bool _loading = false;\n\n  Future<void> ensureLoaded() async {\n    if (_attemptedInitialLoad || _loading || bytes.value != null) return;\n    _attemptedInitialLoad = true;\n    _loading = true;\n    try {\n      if (kIsWeb ||\n          (defaultTargetPlatform != TargetPlatform.android &&\n              defaultTargetPlatform != TargetPlatform.iOS)) {\n        return;\n      }\n      final thumbnail = await _channel.invokeMethod<Uint8List>(\n        'latestGalleryThumbnail',\n      );\n      if (thumbnail != null && thumbnail.isNotEmpty) {\n        bytes.value = Uint8List.fromList(thumbnail);\n      }\n    } on PlatformException {\n      // Thumbnail decoration is best-effort and must never block Camera use.\n    } finally {\n      _loading = false;\n    }\n  }\n\n  void update(Uint8List jpegBytes) {\n    bytes.value = Uint8List.fromList(jpegBytes);\n  }\n}\n''')

          # Gallery control triggers the one-shot initial thumbnail load.
          controls = Path('lib/ui/camera/camera_primary_controls.dart')
          text = controls.read_text()
          anchor = '''  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: onPressed,\n'''
          replacement = '''  @override\n  Widget build(BuildContext context) {\n    CameraRecentThumbnail.instance.ensureLoaded();\n    return TextButton(\n      onPressed: onPressed,\n'''
          gallery_start = text.index('class _GalleryAction')
          side_start = text.index('class _SideAction')
          gallery_block = text[gallery_start:side_start]
          if 'CameraRecentThumbnail.instance.ensureLoaded();' not in gallery_block:
              if anchor not in gallery_block:
                  raise SystemExit('Gallery build anchor not found')
              gallery_block = gallery_block.replace(anchor, replacement, 1)
              text = text[:gallery_start] + gallery_block + text[side_start:]
              controls.write_text(text)

          # Successful PF3 save becomes the latest thumbnail immediately.
          handoff = Path('lib/camera/camera_capture_save_handoff.dart')
          text = handoff.read_text()
          anchor = '''      await _deleteSourceBestEffort(imagePath);\n      show('camera.capture_saved'.tr());\n'''
          replacement = '''      CameraRecentThumbnail.instance.update(result.jpegBytes);\n      await _deleteSourceBestEffort(imagePath);\n      show('camera.capture_saved'.tr());\n'''
          if 'CameraRecentThumbnail.instance.update(result.jpegBytes);' not in text:
              if anchor not in text:
                  raise SystemExit('Capture thumbnail update anchor not found')
              text = text.replace(anchor, replacement, 1)
              handoff.write_text(text)

          # Greeting requests both read and write access before entering Camera.
          greeting = Path('lib/ui/screens/greeting_screen.dart')
          text = greeting.read_text()
          anchor = '''      final camera = await _permissionService.requestCamera();\n      final gallery = await _permissionService.requestGalleryWrite();\n      if (!mounted) return;\n      setState(() {\n        _cameraPermission = camera;\n        _galleryPermission = gallery;\n      });\n'''
          replacement = '''      final camera = await _permissionService.requestCamera();\n      final galleryRead = await _permissionService.requestGalleryRead();\n      final galleryWrite = await _permissionService.requestGalleryWrite();\n      if (!mounted) return;\n      setState(() {\n        _cameraPermission = camera;\n        _galleryPermission = _combineGalleryPermissions(\n          galleryRead,\n          galleryWrite,\n        );\n      });\n'''
          if anchor not in text:
              raise SystemExit('Greeting permission anchor not found')
          text = text.replace(anchor, replacement, 1)
          method_anchor = '''  Future<void> _continue() async {\n'''
          helper = '''  PermissionDecision _combineGalleryPermissions(\n    PermissionDecision read,\n    PermissionDecision write,\n  ) {\n    if (read == PermissionDecision.restricted ||\n        write == PermissionDecision.restricted) {\n      return PermissionDecision.restricted;\n    }\n    if (read == PermissionDecision.denied ||\n        write == PermissionDecision.denied) {\n      return PermissionDecision.denied;\n    }\n    return PermissionDecision.granted;\n  }\n\n'''
          if '_combineGalleryPermissions(' not in text[text.index('class _GreetingScreenState'):text.index('  @override\n  Widget build', text.index('class _GreetingScreenState'))]:
              text = text.replace(method_anchor, helper + method_anchor, 1)
          greeting.write_text(text)

          # Dart platform permission bridge: wire Gallery read request.
          services = Path('lib/app/platform_media_services.dart')
          text = services.read_text()
          text = text.replace(
              '''  @override\n  Future<PermissionDecision> requestGalleryRead() async =>\n      PermissionDecision.denied;\n''',
              '''  @override\n  Future<PermissionDecision> requestGalleryRead() =>\n      _request('requestGalleryRead');\n''',
          )
          services.write_text(text)

          # Android permissions + MediaStore thumbnail.
          android = Path('android/app/src/main/kotlin/dev/pixelcraft/pixelcraft/MainActivity.kt')
          android.write_text(r'''package dev.pixelcraft.pixelcraft

import android.Manifest
import android.content.ContentUris
import android.content.pm.PackageManager
import android.os.Build
import android.provider.MediaStore
import android.util.Size
import androidx.core.app.ActivityCompat
import androidx.core.content.ContextCompat
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.io.ByteArrayOutputStream

/** App shell only. Native GPU registration lives in pixelcraft_gpu. */
class MainActivity : FlutterActivity() {
    companion object {
        private const val PERMISSION_CHANNEL = "dev.cnxdev.pixelcraft/permissions"
        private const val CAMERA_REQUEST = 4300
        private const val GALLERY_WRITE_REQUEST = 4301
        private const val GALLERY_READ_REQUEST = 4302
    }

    private var pendingCameraPermissionResult: MethodChannel.Result? = null
    private var pendingGalleryPermissionResult: MethodChannel.Result? = null
    private var pendingGalleryReadPermissionResult: MethodChannel.Result? = null

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(
            flutterEngine.dartExecutor.binaryMessenger,
            PERMISSION_CHANNEL,
        ).setMethodCallHandler { call, result ->
            when (call.method) {
                "requestCamera" -> requestPermission(
                    permission = Manifest.permission.CAMERA,
                    requestCode = CAMERA_REQUEST,
                    result = result,
                )
                "requestGalleryRead" -> requestGalleryReadPermission(result)
                "requestGalleryWrite" -> requestGalleryWritePermission(result)
                "latestGalleryThumbnail" -> latestGalleryThumbnail(result)
                else -> result.notImplemented()
            }
        }
    }

    private fun requestPermission(
        permission: String,
        requestCode: Int,
        result: MethodChannel.Result,
    ) {
        if (ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED) {
            result.success("granted")
            return
        }
        if (requestCode == CAMERA_REQUEST && pendingCameraPermissionResult != null) {
            result.success("denied")
            return
        }
        pendingCameraPermissionResult = result
        ActivityCompat.requestPermissions(this, arrayOf(permission), requestCode)
    }

    private fun requestGalleryReadPermission(result: MethodChannel.Result) {
        if (hasGalleryReadPermission()) {
            result.success("granted")
            return
        }
        if (pendingGalleryReadPermissionResult != null) {
            result.success("denied")
            return
        }

        val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            Manifest.permission.READ_MEDIA_IMAGES
        } else {
            Manifest.permission.READ_EXTERNAL_STORAGE
        }
        pendingGalleryReadPermissionResult = result
        ActivityCompat.requestPermissions(this, arrayOf(permission), GALLERY_READ_REQUEST)
    }

    private fun hasGalleryReadPermission(): Boolean {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            if (
                ContextCompat.checkSelfPermission(
                    this,
                    Manifest.permission.READ_MEDIA_IMAGES,
                ) == PackageManager.PERMISSION_GRANTED
            ) {
                return true
            }
            if (Build.VERSION.SDK_INT >= 34) {
                return ContextCompat.checkSelfPermission(
                    this,
                    Manifest.permission.READ_MEDIA_VISUAL_USER_SELECTED,
                ) == PackageManager.PERMISSION_GRANTED
            }
            return false
        }
        return ContextCompat.checkSelfPermission(
            this,
            Manifest.permission.READ_EXTERNAL_STORAGE,
        ) == PackageManager.PERMISSION_GRANTED
    }

    private fun requestGalleryWritePermission(result: MethodChannel.Result) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
            // MediaStore scoped storage can add a new image without storage permission.
            result.success("granted")
            return
        }

        if (
            ContextCompat.checkSelfPermission(
                this,
                Manifest.permission.WRITE_EXTERNAL_STORAGE,
            ) == PackageManager.PERMISSION_GRANTED
        ) {
            result.success("granted")
            return
        }

        if (pendingGalleryPermissionResult != null) {
            result.success("denied")
            return
        }

        pendingGalleryPermissionResult = result
        ActivityCompat.requestPermissions(
            this,
            arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE),
            GALLERY_WRITE_REQUEST,
        )
    }

    private fun latestGalleryThumbnail(result: MethodChannel.Result) {
        if (!hasGalleryReadPermission()) {
            result.success(null)
            return
        }

        try {
            val projection = arrayOf(MediaStore.Images.Media._ID)
            val cursor = contentResolver.query(
                MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                projection,
                null,
                null,
                "${MediaStore.Images.Media.DATE_ADDED} DESC",
            )
            cursor.use {
                if (it == null || !it.moveToFirst()) {
                    result.success(null)
                    return
                }
                val id = it.getLong(it.getColumnIndexOrThrow(MediaStore.Images.Media._ID))
                val uri = ContentUris.withAppendedId(
                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                    id,
                )
                val bitmap = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    contentResolver.loadThumbnail(uri, Size(128, 128), null)
                } else {
                    @Suppress("DEPRECATION")
                    MediaStore.Images.Thumbnails.getThumbnail(
                        contentResolver,
                        id,
                        MediaStore.Images.Thumbnails.MINI_KIND,
                        null,
                    )
                }
                if (bitmap == null) {
                    result.success(null)
                    return
                }
                val output = ByteArrayOutputStream()
                bitmap.compress(android.graphics.Bitmap.CompressFormat.JPEG, 78, output)
                bitmap.recycle()
                result.success(output.toByteArray())
            }
        } catch (_: SecurityException) {
            result.success(null)
        } catch (_: Exception) {
            result.success(null)
        }
    }

    override fun onRequestPermissionsResult(
        requestCode: Int,
        permissions: Array<out String>,
        grantResults: IntArray,
    ) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults)
        when (requestCode) {
            CAMERA_REQUEST -> completePermissionRequest(
                result = pendingCameraPermissionResult,
                permission = Manifest.permission.CAMERA,
                grantResults = grantResults,
                clear = { pendingCameraPermissionResult = null },
            )
            GALLERY_WRITE_REQUEST -> completePermissionRequest(
                result = pendingGalleryPermissionResult,
                permission = Manifest.permission.WRITE_EXTERNAL_STORAGE,
                grantResults = grantResults,
                clear = { pendingGalleryPermissionResult = null },
            )
            GALLERY_READ_REQUEST -> {
                val pending = pendingGalleryReadPermissionResult
                pendingGalleryReadPermissionResult = null
                pending?.success(
                    if (hasGalleryReadPermission()) {
                        "granted"
                    } else {
                        val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                            Manifest.permission.READ_MEDIA_IMAGES
                        } else {
                            Manifest.permission.READ_EXTERNAL_STORAGE
                        }
                        if (ActivityCompat.shouldShowRequestPermissionRationale(this, permission)) {
                            "denied"
                        } else {
                            "restricted"
                        }
                    },
                )
            }
        }
    }

    private fun completePermissionRequest(
        result: MethodChannel.Result?,
        permission: String,
        grantResults: IntArray,
        clear: () -> Unit,
    ) {
        result ?: return
        clear()
        val granted = grantResults.isNotEmpty() &&
            grantResults[0] == PackageManager.PERMISSION_GRANTED
        if (granted) {
            result.success("granted")
            return
        }
        val canAskAgain = ActivityCompat.shouldShowRequestPermissionRationale(this, permission)
        result.success(if (canAskAgain) "denied" else "restricted")
    }
}
''')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          anchor = '''    <uses-permission\n        android:name="android.permission.WRITE_EXTERNAL_STORAGE"\n        android:maxSdkVersion="28"\n        tools:ignore="ScopedStorage" />\n'''
          addition = anchor + '''    <uses-permission\n        android:name="android.permission.READ_EXTERNAL_STORAGE"\n        android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />\n'''
          if 'android.permission.READ_MEDIA_IMAGES' not in text:
              if anchor not in text:
                  raise SystemExit('Android manifest permission anchor not found')
              text = text.replace(anchor, addition, 1)
              manifest.write_text(text)

          # iOS: read/write Photo Library permission + newest accessible PHAsset thumbnail.
          ios = Path('ios/Runner/AppDelegate.swift')
          ios.write_text('''import AVFoundation\nimport Flutter\nimport Photos\nimport UIKit\n\n@main\n@objc class AppDelegate: FlutterAppDelegate, FlutterImplicitEngineDelegate {\n  private static let permissionChannel = "dev.cnxdev.pixelcraft/permissions"\n\n  override func application(\n    _ application: UIApplication,\n    didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?\n  ) -> Bool {\n    return super.application(application, didFinishLaunchingWithOptions: launchOptions)\n  }\n\n  func didInitializeImplicitFlutterEngine(_ engineBridge: FlutterImplicitEngineBridge) {\n    GeneratedPluginRegistrant.register(with: engineBridge.pluginRegistry)\n\n    let channel = FlutterMethodChannel(\n      name: Self.permissionChannel,\n      binaryMessenger: engineBridge.applicationRegistrar.messenger()\n    )\n    channel.setMethodCallHandler { call, result in\n      switch call.method {\n      case "requestCamera":\n        Self.requestCamera(result)\n      case "requestGalleryRead":\n        Self.requestGalleryRead(result)\n      case "requestGalleryWrite":\n        Self.requestGalleryWrite(result)\n      case "latestGalleryThumbnail":\n        Self.latestGalleryThumbnail(result)\n      default:\n        result(FlutterMethodNotImplemented)\n      }\n    }\n  }\n\n  private static func requestCamera(_ result: @escaping FlutterResult) {\n    switch AVCaptureDevice.authorizationStatus(for: .video) {\n    case .authorized:\n      result("granted")\n    case .restricted, .denied:\n      result("restricted")\n    case .notDetermined:\n      AVCaptureDevice.requestAccess(for: .video) { granted in\n        DispatchQueue.main.async {\n          result(granted ? "granted" : "restricted")\n        }\n      }\n    @unknown default:\n      result("denied")\n    }\n  }\n\n  private static func requestGalleryRead(_ result: @escaping FlutterResult) {\n    if #available(iOS 14, *) {\n      PHPhotoLibrary.requestAuthorization(for: .readWrite) { status in\n        DispatchQueue.main.async {\n          result(permissionDecision(for: status))\n        }\n      }\n    } else {\n      PHPhotoLibrary.requestAuthorization { status in\n        DispatchQueue.main.async {\n          result(permissionDecision(for: status))\n        }\n      }\n    }\n  }\n\n  private static func requestGalleryWrite(_ result: @escaping FlutterResult) {\n    if #available(iOS 14, *) {\n      let readWrite = PHPhotoLibrary.authorizationStatus(for: .readWrite)\n      if readWrite == .authorized || readWrite == .limited {\n        result("granted")\n        return\n      }\n      PHPhotoLibrary.requestAuthorization(for: .addOnly) { status in\n        DispatchQueue.main.async {\n          result(permissionDecision(for: status))\n        }\n      }\n    } else {\n      PHPhotoLibrary.requestAuthorization { status in\n        DispatchQueue.main.async {\n          result(permissionDecision(for: status))\n        }\n      }\n    }\n  }\n\n  private static func latestGalleryThumbnail(_ result: @escaping FlutterResult) {\n    if #available(iOS 14, *) {\n      let status = PHPhotoLibrary.authorizationStatus(for: .readWrite)\n      guard status == .authorized || status == .limited else {\n        result(nil)\n        return\n      }\n    } else {\n      guard PHPhotoLibrary.authorizationStatus() == .authorized else {\n        result(nil)\n        return\n      }\n    }\n\n    let options = PHFetchOptions()\n    options.fetchLimit = 1\n    options.sortDescriptors = [NSSortDescriptor(key: "creationDate", ascending: false)]\n    let assets = PHAsset.fetchAssets(with: .image, options: options)\n    guard let asset = assets.firstObject else {\n      result(nil)\n      return\n    }\n\n    let imageOptions = PHImageRequestOptions()\n    imageOptions.isSynchronous = true\n    imageOptions.deliveryMode = .fastFormat\n    imageOptions.resizeMode = .fast\n    let scale = UIScreen.main.scale\n    let size = CGSize(width: 128 * scale, height: 128 * scale)\n    var payload: FlutterStandardTypedData?\n    PHImageManager.default().requestImage(\n      for: asset,\n      targetSize: size,\n      contentMode: .aspectFill,\n      options: imageOptions\n    ) { image, _ in\n      if let data = image?.jpegData(compressionQuality: 0.78) {\n        payload = FlutterStandardTypedData(bytes: data)\n      }\n    }\n    result(payload)\n  }\n\n  private static func permissionDecision(for status: PHAuthorizationStatus) -> String {\n    switch status {\n    case .authorized, .limited:\n      return "granted"\n    case .restricted, .denied:\n      return "restricted"\n    case .notDetermined:\n      return "denied"\n    @unknown default:\n      return "denied"\n    }\n  }\n}\n''')

          # Documentation.
          doc = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          text = doc.read_text()
          marker = '''- before the first successful save in a session, the Gallery control falls back to the standard Gallery icon;\n'''
          replacement = '''- on first Camera entry, the Gallery control loads the newest accessible image from the system photo library and uses it as the thumbnail;\n- Photo Library read access is requested in the Greeting permission flow because showing an existing system photo requires read/limited access;\n- Android supports full or Android 14+ user-selected image access; iOS supports full or Limited Photos access;\n- if read access is unavailable or the library is empty, the Gallery control falls back to the standard Gallery icon;\n'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          doc.write_text(text)
          PY
      - name: Canonical Dart format
        run: |
          dart format \
            lib/app/platform_media_services.dart \
            lib/camera/camera_recent_thumbnail.dart \
            lib/camera/camera_capture_save_handoff.dart \
            lib/ui/camera/camera_primary_controls.dart \
            lib/ui/screens/greeting_screen.dart
      - name: Remove helper and commit
        run: |
          set -euo pipefail
          rm .github/workflows/pf3_latest_gallery_thumbnail.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: show latest Gallery photo on first camera entry'
          git push origin HEAD:feature/pf3-capture-process-save
