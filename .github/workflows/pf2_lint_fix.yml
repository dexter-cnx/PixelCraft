name: PF2 one-shot Android torch capture fix

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 48 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Preserve torch during still capture
        run: python3 -c "from pathlib import Path; p=Path('packages/dxtr_pixs_gpu/android/src/main/kotlin/dev/pixelcraft/pixelcraft/AndroidGpuCameraOesRenderer.kt'); s=p.read_text(); old='if (!hasFlashForLens(lensFacing) || torchEnabled) {\\n            builder.set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)\\n            builder.set(CaptureRequest.FLASH_MODE, CaptureRequest.FLASH_MODE_OFF)\\n            return\\n        }'; new='if (!hasFlashForLens(lensFacing)) {\\n            builder.set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)\\n            builder.set(CaptureRequest.FLASH_MODE, CaptureRequest.FLASH_MODE_OFF)\\n            return\\n        }\\n        if (torchEnabled) {\\n            builder.set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)\\n            builder.set(CaptureRequest.FLASH_MODE, CaptureRequest.FLASH_MODE_TORCH)\\n            return\\n        }'; assert old in s, 'target still-flash pattern not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dxtr_pixs_gpu/android/src/main/kotlin/dev/pixelcraft/pixelcraft/AndroidGpuCameraOesRenderer.kt
          git commit -m "fix: preserve Android torch during still capture"
          git push origin HEAD:${{ github.head_ref }}
