name: PF2 one-shot lint fix

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 48 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Fix single lint and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          s = p.read_text()
          old = """    if (_isCapturing || _cameraControls.torchEnabled || !_flashAvailable)\n      return;\n"""
          new = """    if (_isCapturing || _cameraControls.torchEnabled || !_flashAvailable) {\n      return;\n    }\n"""
          if old not in s:
              raise SystemExit('target lint pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "style: satisfy camera flow-control lint"
          git push origin HEAD:${{ github.head_ref }}
