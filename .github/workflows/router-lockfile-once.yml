name: Router Lockfile Once

on:
  push:
    branches:
      - agent/go-router-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/go-router-foundation
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Regenerate lockfile
        run: flutter pub get
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.lock
          git commit -m "chore: update dependency lockfile"
          git push origin HEAD:agent/go-router-foundation
