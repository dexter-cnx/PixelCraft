name: PF3 inline capture UX fix

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Patch PF3 camera UX and permissions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout origin/main -- .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          s = screen.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found:\n{old[:160]}')
              s = s.replace(old, new, 1)

          replace_once("import 'dart:async';\n", "import 'dart:async';\nimport 'dart:io';\n")
          replace_once("import '../../camera/camera_capture_save_handoff.dart';\n", "import '../../camera/camera_capture_pipeline.dart';\n")
          replace_once(
              "  final _lookCoordinator = CameraLookPreviewCoordinator();\n",
              "  final _lookCoordinator = CameraLookPreviewCoordinator();\n"
              "  final _capturePipeline = CameraCapturePipeline(\n"
              "    renderer: const RustCameraCaptureRenderer(),\n"
              "    saveService: const GalleryMediaSaveService(),\n"
              "  );\n"
              "  final PermissionService _permissionService =\n"
              "      const PlatformPermissionService();\n",
          )
          replace_once(
              "  bool _isCapturing = false;\n  String? _error;\n",
              "  bool _isCapturing = false;\n"
              "  PermissionDecision? _galleryWritePermission;\n"
              "  String? _pendingCapturePath;\n"
              "  CameraLookState? _pendingCaptureLook;\n"
              "  String? _error;\n",
          )
          replace_once(
              "    unawaited(_discoverAndInitialize());\n  }\n",
              "    unawaited(_initializeStartup());\n  }\n\n"
              "  Future<void> _initializeStartup() async {\n"
              "    await _requestStartupGalleryPermission();\n"
              "    if (!mounted) return;\n"
              "    await _discoverAndInitialize();\n"
              "  }\n\n"
              "  Future<void> _requestStartupGalleryPermission() async {\n"
              "    final decision = await _permissionService.requestGalleryWrite();\n"
              "    if (!mounted) return;\n"
              "    setState(() => _galleryWritePermission = decision);\n"
              "    if (decision != PermissionDecision.granted) {\n"
              "      _showCameraSnack('camera.gallery_permission_required'.tr());\n"
              "    }\n"
              "  }\n",
          )
          replace_once(
              "    final controller = _controller;\n    _controller = null;\n    if (controller != null) unawaited(controller.dispose());\n    super.dispose();\n",
              "    final controller = _controller;\n"
              "    _controller = null;\n"
              "    if (controller != null) unawaited(controller.dispose());\n"
              "    final pendingCapturePath = _pendingCapturePath;\n"
              "    _pendingCapturePath = null;\n"
              "    _pendingCaptureLook = null;\n"
              "    if (pendingCapturePath != null) {\n"
              "      unawaited(_deleteCaptureBestEffort(pendingCapturePath));\n"
              "    }\n"
              "    super.dispose();\n",
          )

          old_capture = '''  Future<void> _capture() async {
    if (_isCapturing) return;
    setState(() => _isCapturing = true);
    try {
      if (_useNativeGpu && _gpuRendererId != null) {
        await _captureNative(_gpuRendererId!);
      } else {
        await _captureFallback();
      }
    } finally {
      if (mounted) setState(() => _isCapturing = false);
    }
  }

  Future<void> _captureNative(String rendererId) async {
    await _lookCoordinator.flush();
    final look = _cameraLook;
    final path = await _nativeCameraBridge.capturePhoto(rendererId);
    if (!mounted) return;
    await _gpuBridge.pause(rendererId);
    if (!mounted) return;
    await _saveCapture(path, look: look);
    if (!mounted || rendererId != _gpuRendererId) return;
    await _gpuBridge.resume(rendererId);
  }

  Future<void> _captureFallback() async {
    final controller = _controller;
    if (controller == null ||
        !controller.value.isInitialized ||
        controller.value.isTakingPicture) {
      return;
    }
    final capture = await controller.takePicture();
    if (!mounted) return;
    final camera = _activeCamera;
    final look = _cameraLook;
    await _detachAndDisposeController(showLoading: true);
    if (!mounted) return;
    await _saveCapture(capture.path, look: look);
    if (!mounted) return;
    if (camera != null) await _initializeCamera(camera);
  }
'''
          new_capture = '''  Future<void> _capture() async {
    if (_isCapturing) return;
    final galleryPermission = _galleryWritePermission;
    if (galleryPermission == null) {
      _showCameraSnack('camera.gallery_permission_pending'.tr());
      return;
    }
    if (galleryPermission != PermissionDecision.granted) {
      _showCameraSnack('camera.gallery_permission_required'.tr());
      return;
    }

    await _discardPendingCapture();
    if (!mounted) return;
    setState(() => _isCapturing = true);
    try {
      if (_useNativeGpu && _gpuRendererId != null) {
        await _captureNative(_gpuRendererId!);
      } else {
        await _captureFallback();
      }
    } finally {
      if (mounted) setState(() => _isCapturing = false);
    }
  }

  Future<void> _captureNative(String rendererId) async {
    await _lookCoordinator.flush();
    final look = _cameraLook;
    final path = await _nativeCameraBridge.capturePhoto(rendererId);
    if (!mounted) return;
    await _processAndSaveCapture(path, look: look);
  }

  Future<void> _captureFallback() async {
    final controller = _controller;
    if (controller == null ||
        !controller.value.isInitialized ||
        controller.value.isTakingPicture) {
      return;
    }
    final capture = await controller.takePicture();
    if (!mounted) return;
    await _processAndSaveCapture(capture.path, look: _cameraLook);
  }
'''
          replace_once(old_capture, new_capture)

          old_save = '''  Future<void> _saveCapture(
    String imagePath, {
    required CameraLookState look,
  }) => Navigator.of(context).push(
    MaterialPageRoute(
      builder: (_) => CameraCaptureSaveHandoff(
        imagePath: imagePath,
        look: look,
      ),
    ),
  );

'''
          new_save = '''  void _showCameraSnack(
    String message, {
    Duration duration = const Duration(seconds: 2),
    SnackBarAction? action,
  }) {
    if (!mounted) return;
    final messenger = ScaffoldMessenger.of(context);
    messenger.hideCurrentSnackBar();
    messenger.showSnackBar(
      SnackBar(content: Text(message), duration: duration, action: action),
    );
  }

  Future<void> _processAndSaveCapture(
    String imagePath, {
    required CameraLookState look,
  }) async {
    _pendingCapturePath = imagePath;
    _pendingCaptureLook = look;
    _showCameraSnack(
      'camera.processing_photo'.tr(),
      duration: const Duration(minutes: 2),
    );

    try {
      final sourceBytes = await File(imagePath).readAsBytes();
      await _capturePipeline.processAndSave(
        sourceJpeg: sourceBytes,
        look: look,
        onPhase: (phase) {
          if (phase == ProcessingJobPhase.saving) {
            _showCameraSnack(
              'camera.saving_photo'.tr(),
              duration: const Duration(minutes: 2),
            );
          }
        },
      );
      await _deleteCaptureBestEffort(imagePath);
      if (_pendingCapturePath == imagePath) {
        _pendingCapturePath = null;
        _pendingCaptureLook = null;
      }
      _showCameraSnack('camera.capture_saved'.tr());
    } catch (_) {
      _showCameraSnack(
        'camera.capture_failed'.tr(),
        duration: const Duration(seconds: 8),
        action: SnackBarAction(
          label: 'camera.try_again'.tr(),
          onPressed: () => unawaited(_retryPendingCapture()),
        ),
      );
    }
  }

  Future<void> _retryPendingCapture() async {
    if (_isCapturing) return;
    final path = _pendingCapturePath;
    final look = _pendingCaptureLook;
    if (path == null || look == null) return;
    setState(() => _isCapturing = true);
    try {
      await _processAndSaveCapture(path, look: look);
    } finally {
      if (mounted) setState(() => _isCapturing = false);
    }
  }

  Future<void> _discardPendingCapture() async {
    final path = _pendingCapturePath;
    _pendingCapturePath = null;
    _pendingCaptureLook = null;
    if (path != null) await _deleteCaptureBestEffort(path);
  }

  Future<void> _deleteCaptureBestEffort(String path) async {
    try {
      final file = File(path);
      if (await file.exists()) await file.delete();
    } catch (_) {
      // Temporary capture cleanup must not replace the user-visible save result.
    }
  }

'''
          replace_once(old_save, new_save)

          overlay = '''            if (_isCapturing)
              const Positioned.fill(
                child: IgnorePointer(
                  child: ColoredBox(color: Color(0x22000000)),
                ),
              ),
'''
          replace_once(overlay, '')
          screen.write_text(s)

          services = Path('lib/app/platform_media_services.dart')
          p = services.read_text()
          p = p.replace("import 'dart:typed_data';\n", "import 'dart:io';\nimport 'dart:typed_data';\n")
          p = p.replace("import 'package:flutter_riverpod/flutter_riverpod.dart';\n", "import 'package:device_info_plus/device_info_plus.dart';\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter_riverpod/flutter_riverpod.dart';\n")
          p = p.replace("import 'package:image_picker/image_picker.dart';\n", "import 'package:image_picker/image_picker.dart';\nimport 'package:permission_handler/permission_handler.dart' as permissions;\n")
          marker = "final mediaPickerServiceProvider = Provider<MediaPickerService>(\n"
          implementation = r'''class PlatformPermissionService implements PermissionService {
  const PlatformPermissionService();

  @override
  Future<PermissionDecision> requestCamera() =>
      _request(permissions.Permission.camera);

  @override
  Future<PermissionDecision> requestGalleryRead() async {
    if (kIsWeb) return PermissionDecision.denied;
    if (Platform.isIOS) return _request(permissions.Permission.photos);
    if (Platform.isAndroid) return PermissionDecision.granted;
    return PermissionDecision.denied;
  }

  @override
  Future<PermissionDecision> requestGalleryWrite() async {
    if (kIsWeb) return PermissionDecision.denied;
    if (Platform.isIOS) {
      return _request(permissions.Permission.photosAddOnly);
    }
    if (Platform.isAndroid) {
      final sdkInt = (await DeviceInfoPlugin().androidInfo).version.sdkInt;
      if (sdkInt >= 29) return PermissionDecision.granted;
      return _request(permissions.Permission.storage);
    }
    return PermissionDecision.denied;
  }

  Future<PermissionDecision> _request(
    permissions.Permission permission,
  ) async {
    final status = await permission.request();
    if (status.isGranted || status.isLimited) {
      return PermissionDecision.granted;
    }
    if (status.isRestricted || status.isPermanentlyDenied) {
      return PermissionDecision.restricted;
    }
    return PermissionDecision.denied;
  }
}

'''
          if marker not in p:
              raise SystemExit('platform permission provider marker not found')
          p = p.replace(marker, implementation + marker, 1)
          p += "\nfinal permissionServiceProvider = Provider<PermissionService>(\n  (ref) => const PlatformPermissionService(),\n);\n"
          services.write_text(p)

          pubspec = Path('pubspec.yaml')
          t = pubspec.read_text()
          needle = "  image_picker: ^1.1.2\n"
          if needle not in t:
              raise SystemExit('pubspec marker not found')
          t = t.replace(
              needle,
              needle + "  permission_handler: ^12.0.3\n  device_info_plus: ^12.4.0\n",
              1,
          )
          pubspec.write_text(t)

          podfile = Path('ios/Podfile')
          q = podfile.read_text()
          old = """  installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)\n  end\n"""
          new = """  installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)']\n      config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] += [\n        'PERMISSION_CAMERA=1',\n        'PERMISSION_PHOTOS=1',\n        'PERMISSION_PHOTOS_ADD_ONLY=1',\n      ]\n    end\n  end\n"""
          if old not in q:
              raise SystemExit('Podfile marker not found')
          podfile.write_text(q.replace(old, new, 1))

          makefile = Path('Makefile')
          m = makefile.read_text()
          m = m.replace(
              'test: test-unit test-gpu test-widget ## Run Dart unit, GPU plan/session and widget tests, excluding goldens',
              'test: test-unit test-camera test-gpu test-widget ## Run Dart unit, camera, GPU plan/session and widget tests, excluding goldens',
          )
          marker = "test-unit: ## Run controller/state tests\n\t$(FLUTTER) test test/state\n\n"
          if marker not in m:
              raise SystemExit('Makefile test marker not found')
          m = m.replace(
              marker,
              marker + "test-camera: ## Run camera look/capture pipeline tests\n\t$(FLUTTER) test test/camera\n\n",
              1,
          )
          m = m.replace('test test-unit test-gpu test-widget test-fast', 'test test-unit test-camera test-gpu test-widget test-fast', 1)
          makefile.write_text(m)

          for path, pairs in {
              'assets/translations/en.json': [
                  ('    "capture_failed": "Could not process or save this photo.",\n', '    "capture_failed": "Could not process or save this photo.",\n    "gallery_permission_pending": "Preparing Gallery access…",\n    "gallery_permission_required": "Allow photo-library access in Settings before taking a photo.",\n'),
              ],
              'assets/translations/th.json': [
                  ('    "capture_failed": "ไม่สามารถประมวลผลหรือบันทึกรูปนี้ได้",\n', '    "capture_failed": "ไม่สามารถประมวลผลหรือบันทึกรูปนี้ได้",\n    "gallery_permission_pending": "กำลังเตรียมสิทธิ์สำหรับแกลเลอรี…",\n    "gallery_permission_required": "กรุณาอนุญาตสิทธิ์คลังรูปภาพใน Settings ก่อนถ่ายรูป",\n'),
              ],
          }.items():
              f = Path(path)
              x = f.read_text()
              for old, new in pairs:
                  if old not in x:
                      raise SystemExit(f'translation marker not found: {path}')
                  x = x.replace(old, new, 1)
              f.write_text(x)

          doc = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          d = doc.read_text()
          d = d.replace(
              '`lib/camera/camera_capture_save_handoff.dart`\n\n- camera-only PF3 processing/save destination;\n- reads the clean capture, invokes PF3 render/save, deletes the temporary source after success, and returns to Camera;\n- failure keeps the temporary source so Retry can rerun the same clean capture;\n- Cancel cleans up the temporary source.\n\n',
              '',
          )
          d = d.replace(
              '- shutter/native capture routes to `CameraCaptureSaveHandoff`;\n- fallback camera capture routes to `CameraCaptureSaveHandoff`;\n- Gallery selection continues to route to `CameraFilmEditorHandoff` with a neutral `CameraLookState`.\n',
              '- Gallery-write permission is requested during Camera startup, before any shutter action;\n- on modern Android where `skipIfExists: false` needs no storage permission, startup resolves immediately without an unnecessary dialog;\n- shutter/native and fallback captures remain on the Camera screen while Rust render/save runs;\n- processing, saving, success, and failure/Retry feedback use Camera-screen SnackBars;\n- Gallery selection continues to route to `CameraFilmEditorHandoff` with a neutral `CameraLookState`.\n',
          )
          d = d.replace(
              'During camera-capture processing the user sees a short processing/saving state. After Gallery save succeeds the flow returns to Camera and shows a localized saved confirmation.\n\nPF3 does not automatically open the Editor after shutter. Gallery selection still opens the Editor.\n',
              'Camera never navigates to a processing page. The live Camera screen remains visible while a SnackBar progresses through processing and Gallery save. Success shows a short saved SnackBar. Failure keeps the clean temporary capture and exposes Retry from the SnackBar.\n\nGallery-write permission is requested during Camera startup rather than after the shutter. A denied/restricted permission blocks capture-save with a localized Camera SnackBar instead of triggering a late permission prompt. PF3 does not automatically open the Editor after shutter. Gallery selection still opens the Editor.\n',
          )
          doc.write_text(d)

          Path('lib/camera/camera_capture_save_handoff.dart').unlink()
          PY
          flutter pub get
          dart format lib/app/platform_media_services.dart lib/ui/screens/camera_film_preview_screen_g1.dart
          flutter analyze
          flutter test test/camera
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: keep PF3 capture processing on camera"
          git push origin HEAD:feature/pf3-capture-process-save
