name: PF3 enable look previews

on:
  push:
    branches:
      - feature/pf3-capture-process-save
    paths:
      - .github/workflows/pf3_enable_preview_temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - name: Enable Film and Filter thumbnail previews
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()
          old = '  final bool _enableStillCaptureLookPreviews = false;'
          new = '  final bool _enableStillCaptureLookPreviews = true;'
          if old not in text:
              raise SystemExit('PF3 preview feature gate was not found at the expected state')
          path.write_text(text.replace(old, new, 1))
          PY

          mkdir -p test/ui/camera
          cat > test/ui/camera/camera_look_filmstrip_test.dart <<'DART'
          import 'dart:convert';
          import 'dart:typed_data';

          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:pixelcraft/ui/camera/camera_look_filmstrip.dart';

          void main() {
            testWidgets('renders preview bytes and dispatches selection', (tester) async {
              final previewBytes = Uint8List.fromList(
                base64Decode(
                  'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=',
                ),
              );
              String? selected;

              await tester.pumpWidget(
                MaterialApp(
                  home: Scaffold(
                    body: CameraLookFilmstrip(
                      items: [
                        CameraLookFilmstripItem(
                          id: 'original',
                          label: 'Original',
                          index: 0,
                          previewBytes: previewBytes,
                        ),
                        const CameraLookFilmstripItem(
                          id: 'film-a',
                          label: 'Film A',
                          index: 1,
                        ),
                      ],
                      selectedId: 'original',
                      onSelected: (id) => selected = id,
                    ),
                  ),
                ),
              );

              expect(find.byType(Image), findsOneWidget);
              await tester.tap(find.text('Film A'));
              expect(selected, 'film-a');
            });

            testWidgets('shows loading fallback while previews are generated', (
              tester,
            ) async {
              await tester.pumpWidget(
                MaterialApp(
                  home: Scaffold(
                    body: CameraLookFilmstrip(
                      items: const [
                        CameraLookFilmstripItem(
                          id: 'film-a',
                          label: 'Film A',
                          index: 0,
                        ),
                      ],
                      selectedId: 'film-a',
                      isLoadingPreviews: true,
                      onSelected: (_) {},
                    ),
                  ),
                ),
              );

              expect(find.byType(CircularProgressIndicator), findsOneWidget);
            });
          }
          DART

          cat >> docs/PF3_CAPTURE_PROCESS_SAVE.md <<'MD'

          ## Film / Filter preview thumbnails

          - Film and Filter trays now enable the existing Rust-backed still-preview path on native GPU camera sessions.
          - A temporary camera JPEG is used only as the thumbnail render source and is deleted after preview generation.
          - Preview generation remains off the UI isolate and keeps the existing latest-request-wins guard so stale results cannot replace a newer tray request.
          - Thumbnails use the same Rust Film Profile / Creative Filter semantics as the editing pipeline rather than a Flutter-only approximation.
          - This path must still pass Android/iPhone physical validation for camera interruption, shutter side-effects, and live-preview smoothness before PF3 is marked complete.
          MD

          rm .github/workflows/pf3_enable_preview_temp.yml
          dart format test/ui/camera/camera_look_filmstrip_test.dart
      - name: Commit PF3 preview enablement
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/camera_film_preview_screen_g1.dart test/ui/camera/camera_look_filmstrip_test.dart docs/PF3_CAPTURE_PROCESS_SAVE.md .github/workflows/pf3_enable_preview_temp.yml
          git commit -m "feat: enable PF3 Film and Filter preview thumbnails"
          git push origin HEAD:feature/pf3-capture-process-save
