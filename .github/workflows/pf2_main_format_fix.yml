name: PF2 one-shot main.dart format fix

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 48 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PF2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Format main.dart
        run: dart format lib/main.dart

      - name: Commit formatted main.dart
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "style: format camera route theme change"
          git push origin HEAD:${{ github.head_ref }}
