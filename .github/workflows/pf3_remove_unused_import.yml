name: PF3 remove unused import

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Remove unused import and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = path.read_text()
          old = "import 'dart:typed_data';\n"
          if old in text:
              path.write_text(text.replace(old, '', 1))
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_remove_unused_import.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "fix: remove unused camera preview import"
          git push origin HEAD:feature/pf3-capture-process-save
