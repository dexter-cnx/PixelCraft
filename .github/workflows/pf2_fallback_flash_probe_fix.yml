name: PF2 one-shot fallback flash capability fix
on:
  push:
    branches:
      - feature/pf2-unified-camera-look
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf2-unified-camera-look
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Patch fallback capability probe
        run: >-
          python3 -c "from pathlib import Path; p=Path('lib/ui/screens/camera_film_preview_screen_g1.dart'); s=p.read_text(); a='      await controller.initialize();\\n      await _applyFallbackFlashMode(controller, _cameraControls.flashMode);\\n      if (!mounted) {'; b='      await controller.initialize();\\n      final flashCapabilities = await _probeFallbackFlashCapabilities(controller);\\n      if (flashCapabilities.hasFlash) {\\n        await _applyFallbackFlashMode(controller, _cameraControls.flashMode);\\n      }\\n      if (!mounted) {'; assert a in s; s=s.replace(a,b,1); a='          hasFlash: camera.lensDirection == CameraLensDirection.back,\\n          hasTorch: camera.lensDirection == CameraLensDirection.back,\\n          flashMode: _cameraControls.flashMode,'; b='          hasFlash: flashCapabilities.hasFlash,\\n          hasTorch: flashCapabilities.hasTorch,\\n          flashMode: flashCapabilities.hasFlash\\n              ? _cameraControls.flashMode\\n              : NativeCameraFlashMode.off,'; assert a in s; s=s.replace(a,b,1); marker='  Future<void> _applyFallbackFlashMode(\\n'; helper='  Future<({bool hasFlash, bool hasTorch})> _probeFallbackFlashCapabilities(\\n    CameraController controller,\\n  ) async {\\n    var hasFlash = false;\\n    var hasTorch = false;\\n    try {\\n      await controller.setFlashMode(FlashMode.auto);\\n      hasFlash = true;\\n    } on CameraException {}\\n    try {\\n      await controller.setFlashMode(FlashMode.torch);\\n      hasTorch = true;\\n    } on CameraException {}\\n    try {\\n      await controller.setFlashMode(FlashMode.off);\\n    } on CameraException {}\\n    return (hasFlash: hasFlash, hasTorch: hasTorch);\\n  }\\n\\n'; assert marker in s; s=s.replace(marker,helper+marker,1); a='    final controller = _controller;\\n    if (controller == null) return;\\n    await controller.setFlashMode(enabled ? FlashMode.torch : FlashMode.off);\\n    if (!mounted) return;'; b='    final controller = _controller;\\n    if (controller == null) return;\\n    try {\\n      await controller.setFlashMode(enabled ? FlashMode.torch : FlashMode.off);\\n    } on CameraException {\\n      if (!mounted) return;\\n      setState(() {\\n        _cameraControls = NativeCameraControlState(\\n          lensDirection: _cameraControls.lensDirection,\\n          hasFlash: _cameraControls.hasFlash,\\n          hasTorch: false,\\n          flashMode: _cameraControls.flashMode,\\n          torchEnabled: false,\\n          mirrorEnabled: _cameraControls.mirrorEnabled,\\n        );\\n      });\\n      return;\\n    }\\n    if (!mounted) return;'; assert a in s; p.write_text(s.replace(a,b,1))"
      - name: Format
        run: dart format lib/ui/screens/camera_film_preview_screen_g1.dart
      - name: Commit fix
        run: >-
          git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add lib/ui/screens/camera_film_preview_screen_g1.dart && git commit -m 'fix: probe fallback camera flash capabilities' && git push origin HEAD:feature/pf2-unified-camera-look
