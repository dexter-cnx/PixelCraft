name: PF2 one-shot fallback flash capability fix
on:
  push:
    branches:
      - feature/pf2-unified-camera-look
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf2-unified-camera-look
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Document intentional capability probe failures
        run: >-
          python3 -c "from pathlib import Path; p=Path('lib/ui/screens/camera_film_preview_screen_g1.dart'); s=p.read_text(); a='    } on CameraException {}\\n    try {\\n      await controller.setFlashMode(FlashMode.torch);'; b='    } on CameraException {\\n      // Unsupported auto flash means this fallback camera has no flash capability.\\n    }\\n    try {\\n      await controller.setFlashMode(FlashMode.torch);'; assert a in s; s=s.replace(a,b,1); a='    } on CameraException {}\\n    try {\\n      await controller.setFlashMode(FlashMode.off);'; b='    } on CameraException {\\n      // Unsupported torch means this fallback camera has no torch capability.\\n    }\\n    try {\\n      await controller.setFlashMode(FlashMode.off);'; assert a in s; s=s.replace(a,b,1); a='    } on CameraException {}\\n    return (hasFlash: hasFlash, hasTorch: hasTorch);'; b='    } on CameraException {\\n      // Best-effort reset after probing; unsupported off mode needs no further action.\\n    }\\n    return (hasFlash: hasFlash, hasTorch: hasTorch);'; assert a in s; p.write_text(s.replace(a,b,1))"
      - name: Format
        run: dart format lib/ui/screens/camera_film_preview_screen_g1.dart
      - name: Commit fix and remove one-shot workflow
        run: >-
          git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git rm .github/workflows/pf2_fallback_flash_probe_fix.yml && git add lib/ui/screens/camera_film_preview_screen_g1.dart && git commit -m 'fix: finalize fallback flash capability probe' && git push origin HEAD:feature/pf2-unified-camera-look
