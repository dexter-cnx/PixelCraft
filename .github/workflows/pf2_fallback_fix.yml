name: PF2 one-shot fallback look fix

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 48 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Preserve composed look on fallback
        run: python3 -c "from pathlib import Path; p=Path('lib/ui/screens/camera_film_preview_screen_g1.dart'); s=p.read_text(); a='      _selectedTool = CameraPrimaryTool.film;\\n      _cameraLook = _fallbackFilmLook;\\n      _isInitializing = true;'; b='      _selectedTool = CameraPrimaryTool.film;\\n      _isInitializing = true;'; assert a in s, 'runtime fallback pattern not found'; s=s.replace(a,b,1); a='    final look = _fallbackFilmLook;'; b='    final look = _cameraLook;'; assert a in s, 'capture fallback pattern not found'; p.write_text(s.replace(a,b,1))"
      - name: Format
        run: dart format lib/ui/screens/camera_film_preview_screen_g1.dart
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m "fix: preserve composed camera look on fallback"
          git push origin HEAD:${{ github.head_ref }}
