name: Pixel Craft CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pixelcraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Package dependency boundaries
        run: bash tool/check_package_boundaries.sh

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Regenerate FRB bridge
        run: make codegen

      - name: Verify generated native bridge is committed
        run: git diff --exit-code -- rust/src/frb_generated.rs ios/Runner/frb_generated.h

      - name: Verify generated Dart bridge exists
        run: test -f lib/src/rust/api.dart && test -f lib/src/rust/frb_generated.dart

      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: G6 12 MP image characterization
        env:
          G6_MAX_MP: '12'
        run: cargo test --manifest-path rust/Cargo.toml --test g6_image_matrix -- --ignored --nocapture

      - name: GPU LUT parity
        run: make gpu-lut-verify

      - name: Editing package dependencies
        working-directory: packages/pixelcraft_editing
        run: dart pub get

      - name: Editing package analyze
        working-directory: packages/pixelcraft_editing
        run: dart analyze

      - name: Editing package tests
        working-directory: packages/pixelcraft_editing
        run: dart test

      - name: GPU package dependencies
        working-directory: packages/pixelcraft_gpu
        run: flutter pub get

      - name: GPU package analyze
        working-directory: packages/pixelcraft_gpu
        run: flutter analyze

      - name: GPU package tests
        working-directory: packages/pixelcraft_gpu
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze

      - name: State tests
        run: flutter test test/state

      - name: GPU plan/session tests
        run: flutter test test/gpu

      - name: Widget tests
        run: flutter test test/ui --exclude-tags=golden

      - name: Android Rust plugin packaging smoke
        run: make verify-native

  gpu-desktop-core:
    name: wgpu core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache wgpu Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pixelcraft_gpu/rust

      - name: Rust format
        run: cargo fmt --manifest-path packages/pixelcraft_gpu/rust/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path packages/pixelcraft_gpu/rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path packages/pixelcraft_gpu/rust/Cargo.toml

  golden:
    name: Golden tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Regenerate FRB bridge
        run: make codegen

      - name: Verify generated Dart bridge exists
        run: test -f lib/src/rust/api.dart && test -f lib/src/rust/frb_generated.dart

      - name: Golden tests
        run: flutter test test/golden

      - name: iOS Rust plugin packaging smoke
        run: flutter build ios --debug --no-codesign

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-macos-${{ github.run_id }}
          path: test/golden/failures/**
          if-no-files-found: ignore
