name: Pixel Craft CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pixelcraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Regenerate FRB bridge
        run: make codegen

      - name: Verify generated native bridge is committed
        run: git diff --exit-code -- rust/src/frb_generated.rs ios/Runner/frb_generated.h

      - name: Verify generated Dart bridge exists
        run: test -f lib/src/rust/api.dart && test -f lib/src/rust/frb_generated.dart

      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: G6 12 MP image characterization
        env:
          G6_MAX_MP: '12'
        run: cargo test --manifest-path rust/Cargo.toml --test g6_image_matrix -- --ignored --nocapture

      - name: GPU LUT parity
        run: make gpu-lut-verify

      - name: Flutter analyze
        run: flutter analyze

      - name: State tests
        run: flutter test test/state

      - name: GPU plan/session tests
        run: flutter test test/gpu

      - name: Widget tests
        run: flutter test test/ui --exclude-tags=golden

  golden:
    name: Golden tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Regenerate FRB bridge
        run: make codegen

      - name: Verify generated Dart bridge exists
        run: test -f lib/src/rust/api.dart && test -f lib/src/rust/frb_generated.dart

      - name: Golden tests
        run: flutter test test/golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-macos-${{ github.run_id }}
          path: test/golden/failures/**
          if-no-files-found: ignore

  android-release:
    name: Android release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Verify Rust native library is packaged
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | tee /tmp/pixelcraft-apk.txt
          grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libpixelcraft_engine\.so' /tmp/pixelcraft-apk.txt

      - name: Verify release artifact is not debug-signed
        run: |
          if [ -f android/key.properties ]; then
            echo "CI unexpectedly contains android/key.properties" >&2
            exit 1
          fi
          if grep -q 'signingConfig = signingConfigs.getByName("debug")' android/app/build.gradle.kts; then
            echo "Release build still references debug signing" >&2
            exit 1
          fi

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelcraft-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-release:
    name: iOS release no-codesign
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign

      - name: Verify app bundle and Rust/native output exist
        run: |
          test -d build/ios/iphoneos/Runner.app
          find build/ios/iphoneos/Runner.app -maxdepth 3 -type f | sort > /tmp/pixelcraft-ios-files.txt
          grep -E '(pixelcraft_engine|Runner)' /tmp/pixelcraft-ios-files.txt

      - name: Upload unsigned iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixelcraft-ios-release-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
