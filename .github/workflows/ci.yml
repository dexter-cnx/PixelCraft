name: Pixel Craft CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pf3-inline-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-pf3-inline-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Apply PF3 Camera UX patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          python3 tool/pf3_inline_capture_fix.py
          flutter pub get
          dart format lib/app/platform_media_services.dart lib/ui/screens/camera_film_preview_screen_g1.dart
          flutter analyze
          flutter test test/camera
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/pf3_inline_capture_fix.yml tool/pf3_inline_capture_fix.py
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: keep PF3 capture processing on camera'
          git push origin HEAD:feature/pf3-capture-process-save
