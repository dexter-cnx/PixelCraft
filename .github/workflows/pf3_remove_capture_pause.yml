name: PF3 remove capture pause

on:
  push:
    branches: [feature/pf3-capture-process-save]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Remove capture pause resume churn
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = p.read_text()
          old = '''  Future<void> _captureNative(String rendererId) async {\n    await _lookCoordinator.flush();\n    final look = _cameraLook;\n    final path = await _nativeCameraBridge.capturePhoto(rendererId);\n    if (!mounted) return;\n    await _gpuBridge.pause(rendererId);\n    if (!mounted) return;\n    await _saveCapture(path, look: look);\n    if (!mounted || rendererId != _gpuRendererId) return;\n    await _gpuBridge.resume(rendererId);\n  }\n'''
          new = '''  Future<void> _captureNative(String rendererId) async {\n    await _lookCoordinator.flush();\n    final look = _cameraLook;\n    final path = await _nativeCameraBridge.capturePhoto(rendererId);\n    if (!mounted) return;\n\n    // Camera2 still capture uses the existing capture session. Keep the native\n    // preview and GPU renderer alive while PF3 processes/saves in the\n    // background. Tearing Camera2 down for every shutter caused an Android\n    // reopen race where the first post-save CameraLook update could stall.\n    await _saveCapture(path, look: look);\n  }\n'''
          if old not in text:
              raise SystemExit('captureNative anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          git rm .github/workflows/pf3_remove_capture_pause.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ui/screens/camera_film_preview_screen_g1.dart
          git commit -m 'fix: keep Android camera preview alive after capture'
          git push
