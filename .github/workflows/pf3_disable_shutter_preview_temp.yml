name: PF3 disable shutter-backed look preview

on:
  push:
    branches:
      - feature/pf3-capture-process-save
    paths:
      - .github/pf3_disable_shutter_preview_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pf3-capture-process-save
          fetch-depth: 0
      - name: Disable shutter-backed Film Filter thumbnails
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('lib/ui/screens/camera_film_preview_screen_g1.dart')
          text = screen.read_text()
          text = text.replace(
              '  final bool _enableStillCaptureLookPreviews = true;',
              '  final bool _enableStillCaptureLookPreviews = false;',
              1,
          )
          screen.write_text(text)

          docs = Path('docs/PF3_CAPTURE_PROCESS_SAVE.md')
          doc = docs.read_text()
          note = '- **Do not use `capturePhoto()` for Film/Filter thumbnails.** Physical iPhone validation confirmed that opening either tray triggers the system shutter. The still-capture thumbnail path is disabled until a non-shutter live-preview snapshot API is implemented.\n'
          heading = '## Film / Filter preview thumbnails\n\n'
          if note not in doc and heading in doc:
              doc = doc.replace(heading, heading + note, 1)
          docs.write_text(doc)
          PY
          dart format lib/ui/screens/camera_film_preview_screen_g1.dart
          rm -f .github/pf3_disable_shutter_preview_trigger
          rm -f .github/workflows/pf3_disable_shutter_preview_temp.yml
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: stop shutter-backed look thumbnails"
          git push origin HEAD:feature/pf3-capture-process-save
