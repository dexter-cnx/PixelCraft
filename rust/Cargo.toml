[package]
name = "pixelcraft_engine"
version = "0.1.0"
edition = "2021"
description = "PixelCraft's offline image processing engine"
license = "MIT"

[lib]
# Keep the produced native filename deterministic across Cargo and FRB:
# Android => libpixelcraft_engine.so
name = "pixelcraft_engine"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.23"
rayon = "1.8"
fast_image_resize = "3.0"
photon-rs = "=0.3.3"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
