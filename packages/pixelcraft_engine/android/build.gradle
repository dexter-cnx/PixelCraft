// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.pixelcraft_engine'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Kept for compatibility with the CargoKit-generated Android plugin.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.pixelcraft_engine'
    }

    // AndroidX dependencies pulled by the Flutter toolchain require API 34+.
    // Match the app/toolchain level used by Flutter 3.44 and Android SDK 36.
    compileSdkVersion 36
    // Use the NDK version declared by the host Flutter application.
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // Keep Android 5.0 support while compiling against modern APIs.
        minSdkVersion 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../../rust"
    libname = "pixelcraft_engine"
}
