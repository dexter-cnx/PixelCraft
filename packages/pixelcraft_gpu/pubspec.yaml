name: pixelcraft_gpu
description: Preview-only GPU control plane and native preview runtime for PixelCraft.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.pixelcraft.pixelcraft
        pluginClass: PixelcraftGpuPlugin
      ios:
        pluginClass: PixelcraftGpuPlugin
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
