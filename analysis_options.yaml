include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # CargoKit is vendored/generated by flutter_rust_bridge and is maintained
    # as its own Dart package under packages/dxtr_pixs_engine. Root
    # `flutter analyze` must validate PixelCraft source without attempting to
    # resolve CargoKit's private build-tool package dependencies from the app
    # package context.
    - packages/dxtr_pixs_engine/cargokit/**

linter:
  rules:
    prefer_final_locals: true
    # Camera capability probes intentionally swallow CameraException when a
    # flash mode is unsupported; the result is represented by the capability
    # flags instead of an error path.
    empty_catches: false
