include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # CargoKit is vendored/generated by flutter_rust_bridge and is maintained
    # as its own Dart package under rust_builder. Root `flutter analyze` must
    # validate Pixel Craft source without attempting to resolve CargoKit's
    # private build-tool package dependencies from the app package context.
    - rust_builder/cargokit/**

linter:
  rules:
    prefer_final_locals: true
